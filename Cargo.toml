[workspace]
members = ["crates/core", "crates/desktop", "crates/compare"]
default-members = ["crates/desktop"]
resolver = "3"

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
mucrab-core = { path = "crates/core" }
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }

[workspace.lints.rust]
unsafe_code = "forbid"
