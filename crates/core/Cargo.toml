[package]
name = "mucrab-core"
description = "File-management state and recovered behavior for muCrab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
percent-encoding = "=2.3.2"
ssh2 = "=0.9.6"
zeroize = "=1.9.0"
base64 = "=0.22.1"
crc32fast = "=1.5.2"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
zune-core = "=0.5.3"
zune-jpeg = "=0.5.15"
serde_json = "=1.0.151"
icu_collator = "=2.2.1"
icu_locale_core = "=2.3.0"
serde = { version = "=1.0.229", features = ["derive"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
zip = { version = "=9.0.4", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
ssh2 = { version = "=0.9.6", features = ["vendored-openssl"] }
icu_normalizer = "=2.2.0"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "=4.1.0", default-features = false, features = ["crypto-rust"] }
