[package]
name = "mucrab-desktop"
description = "Native two-pane desktop interface for muCrab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "mucrab"

[[bin]]
name = "mucrab"
path = "src/main.rs"

[dependencies]
mucrab-core.workspace = true
url = "=2.5.8"
eframe.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "=0.13.2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "=0.21.1", default-features = false }

[features]
screenshot = ["eframe/__screenshot"]

[lints]
workspace = true
