name: Checks

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.99.1'
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: '-D warnings'

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install system libraries and Rust checks
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libssl-dev libdbus-1-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --no-self-update
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Rust idioms
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Compile tests
        run: cargo test --workspace --all-features --locked --no-run
      - name: Test with two real filesystems
        run: |
          test "$(id -u)" -ne 0
          test_tmp=$(mktemp -d /dev/shm/mucrab-tests.XXXXXX)
          trap 'rm -rf "$test_tmp"' EXIT
          TMPDIR="$test_tmp" cargo test --workspace --all-features --locked
      - name: Check Rust documentation
        run: cargo doc --workspace --no-deps --locked
      - name: Test supporting tools
        run: python3 -B -m unittest discover -s tools -p 'test_*.py' -v
      - name: Report integration scope
        run: |
          echo 'Ordinary tests do not exercise native GUI, live SFTP or credential stores.'
          echo 'Those gates require the documented disposable host/service fixtures.'
